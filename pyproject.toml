[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codebarbuilder"
version = "0.1.0"
description = "Desktop barcode generator for EAN-13, UPC-A, and EAN-8."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "DevAlansc" }
]
dependencies = [
    "Pillow>=10.0",
    "PySide6>=6.6",
    "python-barcode>=0.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pyinstaller>=6.0",
]

[project.scripts]
codebarbuilder = "codebarbuilder.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
